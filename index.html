<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    >

    <title>Wilderness Fishing</title>

    <style>

        /* ========================================================
           Reset
        ======================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #000;
        }

        body {
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            touch-action: none;
        }


        /* ========================================================
           Game Container
        ======================================================== */

        #gameContainer {
            position: relative;

            width: 1280px;
            height: 720px;

            transform-origin: center center;
        }


        /* ========================================================
           Canvas
        ======================================================== */

        #gameCanvas {
            display: block;

            width: 100%;
            height: 100%;

            background: #000;

            aspect-ratio: 16 / 9;
        }


        /* ========================================================
           Loading
        ======================================================== */

        #loading {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(
                -50%,
                -50%
            );

            color: #ffffff;

            font-family:
                Arial,
                sans-serif;

            font-size: 18px;

            pointer-events: none;

            z-index: 100;
        }


        /* ========================================================
           Debug
        ======================================================== */

        #debug {
            position: fixed;

            top: 12px;
            left: 12px;

            padding: 8px 12px;

            color: #ffffff;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

            border-radius: 5px;

            font-family:
                monospace;

            font-size: 14px;

            line-height: 1.6;

            pointer-events: none;
            user-select: none;

            z-index: 1000;
        }


        /* ========================================================
           Rotate Button
        ======================================================== */

        #rotateButton {
            position: fixed;

            top: 16px;
            right: 16px;

            min-width: 100px;

            padding:
                12px
                18px;

            border: none;

            border-radius: 8px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.7
                );

            color: #ffffff;

            font-family:
                Arial,
                sans-serif;

            font-size: 14px;
            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            user-select: none;

            z-index: 9999;

            transition:
                background 0.15s,
                transform 0.15s;
        }


        #rotateButton:hover {
            background:
                rgba(
                    30,
                    30,
                    30,
                    0.9
                );
        }


        #rotateButton:active {
            transform:
                scale(0.95);
        }

    </style>
</head>


<body>


    <!-- ========================================================
         Game
    ======================================================== -->

    <div id="gameContainer">

        <canvas
            id="gameCanvas"
            width="1280"
            height="720"
        ></canvas>

    </div>


    <!-- ========================================================
         Loading
    ======================================================== -->

    <div id="loading">
        Loading...
    </div>


    <!-- ========================================================
         Debug
    ======================================================== -->

    <div id="debug">
        Loading...
    </div>


    <!-- ========================================================
         Rotate
    ======================================================== -->

    <button
        id="rotateButton"
        type="button"
    >
        ROTATE
    </button>



    <script>

        // ========================================================
        // Game Resolution
        // ========================================================

        const GAME_WIDTH =
            1280;

        const GAME_HEIGHT =
            720;

        const GAME_ASPECT =
            GAME_WIDTH /
            GAME_HEIGHT;


        // ========================================================
        // Timeline
        // ========================================================

        /*
            0:00 ~ 2:00

            BG01 往左移動
            BG02 從右側進入。


            2:00 ~ 4:00

            BG02 固定。


            4:00

            Fade Out。


            全黑後：

            BG01 Reset。


            Fade In。


            下一輪。
        */

        const SCROLL_DURATION =
            120;

        const HOLD_DURATION =
            120;

        const MAIN_DURATION =

            SCROLL_DURATION +

            HOLD_DURATION;


        /*
            Fade Out：

            1.5 秒


            Fade In：

            1.5 秒
        */

        const FADE_DURATION =
            1.5;


        // ========================================================
        // DOM
        // ========================================================

        const gameContainer =
            document.getElementById(
                "gameContainer"
            );


        const canvas =
            document.getElementById(
                "gameCanvas"
            );


        const ctx =
            canvas.getContext(
                "2d"
            );


        const loadingElement =
            document.getElementById(
                "loading"
            );


        const debugElement =
            document.getElementById(
                "debug"
            );


        const rotateButton =
            document.getElementById(
                "rotateButton"
            );


        ctx.imageSmoothingEnabled =
            true;


        // ========================================================
        // Assets
        // ========================================================

        const BG01 =
            new Image();

        const BG02 =
            new Image();


        BG01.src =
            "./assets/BG01.png";

        BG02.src =
            "./assets/BG02.png";


        // ========================================================
        // Game State
        // ========================================================

        const game = {

            ready: false,

            lastTimestamp: 0,

            elapsed: 0,

            state:
                "playing",

            fadeAlpha: 0

        };


        // ========================================================
        // Scene
        // ========================================================

        /*
            scene.x = 0

            BG01 完整顯示。


            scene.x = -1280

            BG02 完整顯示。
        */

        const scene = {

            x: 0

        };


        // ========================================================
        // Display State
        // ========================================================

        const display = {

            /*
                false：

                一般 16:9。


                true：

                CSS 旋轉 90 度。
            */

            rotated: false

        };


        // ========================================================
        // Load Image
        // ========================================================

        function loadImage(
            image
        ) {

            return new Promise(
                (
                    resolve,
                    reject
                ) => {

                    if (
                        image.complete &&
                        image.naturalWidth > 0
                    ) {

                        resolve(
                            image
                        );

                        return;

                    }


                    image.onload =
                        function () {

                            resolve(
                                image
                            );

                        };


                    image.onerror =
                        function () {

                            reject(

                                new Error(

                                    "Failed to load: " +

                                    image.src

                                )

                            );

                        };

                }
            );

        }


        // ========================================================
        // Load Assets
        // ========================================================

        async function loadAssets() {

            try {

                await Promise.all([

                    loadImage(
                        BG01
                    ),

                    loadImage(
                        BG02
                    )

                ]);


                game.ready =
                    true;


                loadingElement.style.display =
                    "none";


                console.log(

                    "BG01:",

                    BG01.width,

                    BG01.height

                );


                console.log(

                    "BG02:",

                    BG02.width,

                    BG02.height

                );

            }

            catch (
                error
            ) {

                console.error(
                    error
                );


                loadingElement.textContent =
                    "Failed to load assets.";

            }

        }


        // ========================================================
        // Clamp
        // ========================================================

        function clamp(
            value,
            min,
            max
        ) {

            return Math.max(

                min,

                Math.min(

                    max,

                    value

                )

            );

        }


        // ========================================================
        // Lerp
        // ========================================================

        function lerp(
            start,
            end,
            progress
        ) {

            return (

                start +

                (
                    end -
                    start
                ) *

                progress

            );

        }


        // ========================================================
        // Playing
        // ========================================================

        function updatePlaying(
            deltaTime
        ) {

            game.elapsed +=
                deltaTime;


            // ----------------------------------------------------
            // Phase 1
            //
            // 0 ~ 120 秒
            //
            // BG01 左移。
            // ----------------------------------------------------

            if (
                game.elapsed <
                SCROLL_DURATION
            ) {

                const progress =
                    clamp(

                        game.elapsed /

                        SCROLL_DURATION,

                        0,

                        1

                    );


                scene.x =
                    lerp(

                        0,

                        -GAME_WIDTH,

                        progress

                    );

            }


            // ----------------------------------------------------
            // Phase 2
            //
            // 120 ~ 240 秒
            //
            // BG02 固定。
            // ----------------------------------------------------

            else if (
                game.elapsed <
                MAIN_DURATION
            ) {

                scene.x =
                    -GAME_WIDTH;

            }


            // ----------------------------------------------------
            // 4 分鐘結束
            //
            // Fade Out
            // ----------------------------------------------------

            else {

                scene.x =
                    -GAME_WIDTH;


                game.state =
                    "fadeOut";


                game.fadeAlpha =
                    0;

            }

        }


        // ========================================================
        // Fade Out
        // ========================================================

        function updateFadeOut(
            deltaTime
        ) {

            game.fadeAlpha +=

                deltaTime /

                FADE_DURATION;


            game.fadeAlpha =
                clamp(

                    game.fadeAlpha,

                    0,

                    1

                );


            /*
                完全黑畫面。

                這時候把 Scene
                偷偷 Reset 到 BG01。
            */

            if (
                game.fadeAlpha >= 1
            ) {

                scene.x =
                    0;


                game.elapsed =
                    0;


                game.state =
                    "fadeIn";

            }

        }


        // ========================================================
        // Fade In
        // ========================================================

        function updateFadeIn(
            deltaTime
        ) {

            game.fadeAlpha -=

                deltaTime /

                FADE_DURATION;


            game.fadeAlpha =
                clamp(

                    game.fadeAlpha,

                    0,

                    1

                );


            if (
                game.fadeAlpha <= 0
            ) {

                game.fadeAlpha =
                    0;


                game.state =
                    "playing";

            }

        }


        // ========================================================
        // Update
        // ========================================================

        function update(
            deltaTime
        ) {

            if (
                !game.ready
            ) {

                return;

            }


            switch (
                game.state
            ) {

                case "playing":

                    updatePlaying(
                        deltaTime
                    );

                    break;


                case "fadeOut":

                    updateFadeOut(
                        deltaTime
                    );

                    break;


                case "fadeIn":

                    updateFadeIn(
                        deltaTime
                    );

                    break;

            }


            updateDebug();

        }


        // ========================================================
        // Background
        // ========================================================

        function drawBackground() {

            /*
                BG01
            */

            ctx.drawImage(

                BG01,

                scene.x,
                0,

                GAME_WIDTH,
                GAME_HEIGHT

            );


            /*
                BG02

                永遠接在 BG01
                右側。
            */

            ctx.drawImage(

                BG02,

                scene.x +
                GAME_WIDTH,

                0,

                GAME_WIDTH,
                GAME_HEIGHT

            );

        }


        // ========================================================
        // Fade
        // ========================================================

        function drawFade() {

            if (
                game.fadeAlpha <= 0
            ) {

                return;

            }


            ctx.save();


            ctx.globalAlpha =
                game.fadeAlpha;


            ctx.fillStyle =
                "#000000";


            ctx.fillRect(

                0,
                0,

                GAME_WIDTH,
                GAME_HEIGHT

            );


            ctx.restore();

        }


        // ========================================================
        // Render
        // ========================================================

        function render() {

            ctx.clearRect(

                0,
                0,

                GAME_WIDTH,
                GAME_HEIGHT

            );


            if (
                !game.ready
            ) {

                ctx.fillStyle =
                    "#000";


                ctx.fillRect(

                    0,
                    0,

                    GAME_WIDTH,
                    GAME_HEIGHT

                );


                return;

            }


            // ----------------------------------------------------
            // Background
            // ----------------------------------------------------

            drawBackground();


            // ----------------------------------------------------
            // Player
            //
            // 未來角色畫這裡。
            //
            // 不要加 scene.x。
            // ----------------------------------------------------


            // ----------------------------------------------------
            // UI
            //
            // 未來 UI 畫這裡。
            // ----------------------------------------------------


            // ----------------------------------------------------
            // Fade
            //
            // 必須最後畫。
            // ----------------------------------------------------

            drawFade();

        }


        // ========================================================
        // Debug
        // ========================================================

        function updateDebug() {

            let phase;


            if (
                game.state ===
                "fadeOut"
            ) {

                phase =
                    "Fade Out";

            }

            else if (
                game.state ===
                "fadeIn"
            ) {

                phase =
                    "Fade In";

            }

            else if (
                game.elapsed <
                SCROLL_DURATION
            ) {

                phase =
                    "BG01 Scrolling";

            }

            else {

                phase =
                    "BG02 Hold";

            }


            const minutes =
                Math.floor(

                    game.elapsed /
                    60

                );


            const seconds =
                Math.floor(

                    game.elapsed %
                    60

                );


            debugElement.innerHTML =

                "Phase: " +
                phase +

                "<br>" +

                "Time: " +
                minutes +
                ":" +
                String(
                    seconds
                ).padStart(
                    2,
                    "0"
                ) +

                "<br>" +

                "Scene X: " +
                Math.round(
                    scene.x
                ) +

                "<br>" +

                "Fade: " +
                game.fadeAlpha.toFixed(
                    2
                ) +

                "<br>" +

                "Rotate: " +
                (
                    display.rotated
                        ? "90°"
                        : "0°"
                );

        }


        // ========================================================
        // Game Loop
        // ========================================================

        function gameLoop(
            timestamp
        ) {

            if (
                game.lastTimestamp ===
                0
            ) {

                game.lastTimestamp =
                    timestamp;

            }


            let deltaTime =

                (
                    timestamp -

                    game.lastTimestamp
                )

                / 1000;


            game.lastTimestamp =
                timestamp;


            /*
                防止切 Tab 後
                delta time 太大。
            */

            deltaTime =
                Math.min(

                    deltaTime,

                    0.05

                );


            update(
                deltaTime
            );


            render();


            requestAnimationFrame(
                gameLoop
            );

        }


        // ========================================================
        // Resize Game
        // ========================================================

        function resizeGame() {

            const screenWidth =
                window.innerWidth;


            const screenHeight =
                window.innerHeight;


            let availableWidth;
            let availableHeight;


            /*
                ----------------------------------------------------
                一般模式
                ----------------------------------------------------
            */

            if (
                !display.rotated
            ) {

                availableWidth =
                    screenWidth;


                availableHeight =
                    screenHeight;


                const screenAspect =

                    availableWidth /

                    availableHeight;


                let width;
                let height;


                if (
                    screenAspect >
                    GAME_ASPECT
                ) {

                    /*
                        Screen 比 16:9 寬。

                        高度塞滿。
                    */

                    height =
                        availableHeight;


                    width =
                        height *

                        GAME_ASPECT;

                }

                else {

                    /*
                        Screen 比 16:9 窄。

                        寬度塞滿。
                    */

                    width =
                        availableWidth;


                    height =
                        width /

                        GAME_ASPECT;

                }


                gameContainer.style.width =
                    width +
                    "px";


                gameContainer.style.height =
                    height +
                    "px";


                gameContainer.style.transform =
                    "rotate(0deg)";

            }


            /*
                ----------------------------------------------------
                Rotate 90°
                ----------------------------------------------------
            */

            else {

                /*
                    旋轉後：

                    原本 Game Width
                    會變成畫面 Height。

                    原本 Game Height
                    會變成畫面 Width。
                */

                const rotatedAspect =

                    GAME_HEIGHT /

                    GAME_WIDTH;


                const screenAspect =

                    screenWidth /

                    screenHeight;


                let finalDisplayWidth;
                let finalDisplayHeight;


                if (
                    screenAspect >
                    rotatedAspect
                ) {

                    /*
                        Screen 相對較寬。

                        用高度為基準。
                    */

                    finalDisplayHeight =
                        screenHeight;


                    finalDisplayWidth =

                        finalDisplayHeight *

                        rotatedAspect;

                }

                else {

                    /*
                        Screen 相對較窄。

                        用寬度為基準。
                    */

                    finalDisplayWidth =
                        screenWidth;


                    finalDisplayHeight =

                        finalDisplayWidth /

                        rotatedAspect;

                }


                /*
                    注意：

                    Container 自己仍是
                    16:9。

                    只是 Rotate 90°。
                */

                gameContainer.style.width =

                    finalDisplayHeight +

                    "px";


                gameContainer.style.height =

                    finalDisplayWidth +

                    "px";


                gameContainer.style.transform =

                    "rotate(90deg)";

            }

        }


        // ========================================================
        // Try Native Orientation
        // ========================================================

        async function tryNativeRotate() {

            /*
                部分手機瀏覽器支援：

                screen.orientation.lock()

                但通常要求：

                Fullscreen
                +
                User Gesture

                所以這裡只是優先嘗試。

                失敗就走 CSS Rotate。
            */

            try {

                if (
                    document.documentElement
                        .requestFullscreen &&
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                }


                if (
                    screen.orientation &&
                    screen.orientation.lock
                ) {

                    await screen
                        .orientation
                        .lock(
                            "landscape"
                        );


                    /*
                        Native 已經旋轉，
                        CSS 不需要再 Rotate。
                    */

                    display.rotated =
                        false;


                    resizeGame();


                    return true;

                }

            }

            catch (
                error
            ) {

                console.log(

                    "Native orientation unavailable. Using CSS rotation.",

                    error

                );

            }


            return false;

        }


        // ========================================================
        // Rotate Button
        // ========================================================

        rotateButton.addEventListener(

            "click",

            async function () {

                /*
                    手機 Portrait 狀態時，

                    優先嘗試真的切成
                    Landscape。
                */

                if (
                    window.innerHeight >
                    window.innerWidth
                ) {

                    const nativeSuccess =
                        await tryNativeRotate();


                    if (
                        nativeSuccess
                    ) {

                        return;

                    }

                }


                /*
                    Native API 不可用：

                    使用 CSS Rotate。
                */

                display.rotated =
                    !display.rotated;


                resizeGame();

            }

        );


        // ========================================================
        // Resize
        // ========================================================

        window.addEventListener(

            "resize",

            resizeGame

        );


        window.addEventListener(

            "orientationchange",

            function () {

                /*
                    等裝置方向更新完
                    再重新計算。
                */

                setTimeout(

                    resizeGame,

                    100

                );

            }

        );


        // ========================================================
        // Start
        // ========================================================

        resizeGame();


        loadAssets();


        requestAnimationFrame(
            gameLoop
        );

    </script>

</body>
</html>
