<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Wilderness Fishing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            font-family: Arial, sans-serif;
        }

        /* ========================================================
           Full Screen Blurred Backdrop
        ======================================================== */
        #backdropCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;

            filter:
                brightness(0.42)
                blur(4px);

            transform: scale(1.06);
            transform-origin: center center;

            background: #000;
        }

        /* ========================================================
           Outside Dark Masks
        ======================================================== */
        .mask {
            position: fixed;
            z-index: 5;
            pointer-events: none;
        }

        #maskTop,
        #maskBottom {
            background: rgba(0, 0, 0, 0.48);
        }

        #maskLeft {
            background: linear-gradient(
                to right,
                rgba(0, 0, 0, 0.72),
                rgba(0, 0, 0, 0.52)
            );
        }

        #maskRight {
            background: linear-gradient(
                to left,
                rgba(0, 0, 0, 0.72),
                rgba(0, 0, 0, 0.52)
            );
        }

        /* ========================================================
           Main 16:9 Game Area
        ======================================================== */
        #gameContainer {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 1280px;
            height: 720px;
            transform: translate(-50%, -50%);
            transform-origin: center center;
            z-index: 10;
            overflow: hidden;
            background: #000;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04),
                0 16px 48px rgba(0, 0, 0, 0.45);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* ========================================================
           UI
        ======================================================== */
        #loading {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            z-index: 10000;
            pointer-events: none;
        }

        #debug {
            position: fixed;
            left: max(12px, env(safe-area-inset-left));
            top: max(12px, env(safe-area-inset-top));
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
            z-index: 10001;
            pointer-events: none;
        }

        #rotateButton {
            position: fixed;
            right: max(16px, env(safe-area-inset-right));
            top: max(16px, env(safe-area-inset-top));
            min-width: 108px;
            padding: 12px 20px;
            border: 0;
            border-radius: 10px;
            background: rgba(20, 20, 20, 0.88);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 10002;
            -webkit-tap-highlight-color: transparent;
        }

        #rotateButton:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>

    <canvas id="backdropCanvas"></canvas>

    <div id="maskTop" class="mask"></div>
    <div id="maskBottom" class="mask"></div>
    <div id="maskLeft" class="mask"></div>
    <div id="maskRight" class="mask"></div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>

    <div id="loading">Loading...</div>

    <div id="debug">Loading...</div>

    <button id="rotateButton" type="button">ROTATE</button>

    <script>
        // ========================================================
        // Base Resolution
        // ========================================================

        const GAME_WIDTH = 1280;
        const GAME_HEIGHT = 720;
        const GAME_ASPECT = GAME_WIDTH / GAME_HEIGHT;

        // ========================================================
        // Timeline
        // 0:00 ~ 2:00  BG01 scroll
        // 2:00 ~ 4:00  BG02 hold
        // 4:00         fade out -> reset -> fade in
        // ========================================================

        const SCROLL_DURATION = 120;
        const HOLD_DURATION = 120;
        const MAIN_DURATION = SCROLL_DURATION + HOLD_DURATION;
        const FADE_DURATION = 1.5;

        // ========================================================
        // DOM
        // ========================================================

        const gameContainer = document.getElementById("gameContainer");
        const gameCanvas = document.getElementById("gameCanvas");
        const gameCtx = gameCanvas.getContext("2d");

        const backdropCanvas = document.getElementById("backdropCanvas");
        const backdropCtx = backdropCanvas.getContext("2d");

        const maskTop = document.getElementById("maskTop");
        const maskBottom = document.getElementById("maskBottom");
        const maskLeft = document.getElementById("maskLeft");
        const maskRight = document.getElementById("maskRight");

        const loadingElement = document.getElementById("loading");
        const debugElement = document.getElementById("debug");
        const rotateButton = document.getElementById("rotateButton");

        gameCtx.imageSmoothingEnabled = true;
        backdropCtx.imageSmoothingEnabled = true;

        // ========================================================
        // Assets
        // ========================================================

        const BG01 = new Image();
        const BG02 = new Image();

        BG01.src = "./assets/BG01.png";
        BG02.src = "./assets/BG02.png";

        // ========================================================
        // State
        // ========================================================

        const game = {
            ready: false,
            lastTimestamp: 0,
            elapsed: 0,
            state: "playing",
            fadeAlpha: 0
        };

        const scene = {
            x: 0
        };

        const display = {
            rotated: false,
            layout: {
                viewportWidth: 0,
                viewportHeight: 0,
                displayWidth: 0,
                displayHeight: 0,
                screenBoxWidth: 0,
                screenBoxHeight: 0,
                left: 0,
                top: 0
            }
        };

        // ========================================================
        // Helpers
        // ========================================================

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function lerp(start, end, t) {
            return start + (end - start) * t;
        }

        function isMobileDevice() {
            return (
                window.matchMedia("(pointer: coarse)").matches ||
                /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
            );
        }

        function getViewportSize() {
            if (window.visualViewport) {
                return {
                    width: window.visualViewport.width,
                    height: window.visualViewport.height
                };
            }

            return {
                width: window.innerWidth,
                height: window.innerHeight
            };
        }

        function loadImage(image) {
            return new Promise((resolve, reject) => {
                if (image.complete && image.naturalWidth > 0) {
                    resolve(image);
                    return;
                }

                image.onload = () => resolve(image);
                image.onerror = () =>
                    reject(new Error("Failed to load " + image.src));
            });
        }

        async function loadAssets() {
            try {
                await Promise.all([
                    loadImage(BG01),
                    loadImage(BG02)
                ]);

                game.ready = true;
                loadingElement.style.display = "none";
            } catch (error) {
                console.error(error);
                loadingElement.textContent = "Failed to load assets.";
            }
        }

        // ========================================================
        // Resize Canvases
        // ========================================================

        function resizeBackdropCanvas(viewportWidth, viewportHeight) {
            const dpr = window.devicePixelRatio || 1;

            backdropCanvas.width = Math.max(1, Math.round(viewportWidth * dpr));
            backdropCanvas.height = Math.max(1, Math.round(viewportHeight * dpr));

            backdropCanvas.style.width = viewportWidth + "px";
            backdropCanvas.style.height = viewportHeight + "px";

            backdropCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function updateMasks(layout) {
            const {
                viewportWidth,
                viewportHeight,
                left,
                top,
                screenBoxWidth,
                screenBoxHeight
            } = layout;

            const right = left + screenBoxWidth;
            const bottom = top + screenBoxHeight;

            // Top
            maskTop.style.left = "0px";
            maskTop.style.top = "0px";
            maskTop.style.width = viewportWidth + "px";
            maskTop.style.height = Math.max(0, top) + "px";

            // Bottom
            maskBottom.style.left = "0px";
            maskBottom.style.top = bottom + "px";
            maskBottom.style.width = viewportWidth + "px";
            maskBottom.style.height = Math.max(0, viewportHeight - bottom) + "px";

            // Left
            maskLeft.style.left = "0px";
            maskLeft.style.top = top + "px";
            maskLeft.style.width = Math.max(0, left) + "px";
            maskLeft.style.height = Math.max(0, screenBoxHeight) + "px";

            // Right
            maskRight.style.left = right + "px";
            maskRight.style.top = top + "px";
            maskRight.style.width = Math.max(0, viewportWidth - right) + "px";
            maskRight.style.height = Math.max(0, screenBoxHeight) + "px";
        }

        function resizeGame() {
            const { width: viewportWidth, height: viewportHeight } = getViewportSize();

            let availableWidth;
            let availableHeight;

            if (!display.rotated) {
                availableWidth = viewportWidth;
                availableHeight = viewportHeight;
            } else {
                availableWidth = viewportHeight;
                availableHeight = viewportWidth;
            }

            const scale = Math.min(
                availableWidth / GAME_WIDTH,
                availableHeight / GAME_HEIGHT
            );

            const displayWidth = GAME_WIDTH * scale;
            const displayHeight = GAME_HEIGHT * scale;

            gameContainer.style.width = displayWidth + "px";
            gameContainer.style.height = displayHeight + "px";

            if (display.rotated) {
                gameContainer.style.transform =
                    "translate(-50%, -50%) rotate(90deg)";
            } else {
                gameContainer.style.transform =
                    "translate(-50%, -50%) rotate(0deg)";
            }

            const screenBoxWidth = display.rotated ? displayHeight : displayWidth;
            const screenBoxHeight = display.rotated ? displayWidth : displayHeight;
            const left = (viewportWidth - screenBoxWidth) * 0.5;
            const top = (viewportHeight - screenBoxHeight) * 0.5;

            display.layout = {
                viewportWidth,
                viewportHeight,
                displayWidth,
                displayHeight,
                screenBoxWidth,
                screenBoxHeight,
                left,
                top
            };

            resizeBackdropCanvas(viewportWidth, viewportHeight);
            updateMasks(display.layout);
        }

        // ========================================================
        // Timeline Update
        // ========================================================

        function updatePlaying(deltaTime) {
            game.elapsed += deltaTime;

            if (game.elapsed < SCROLL_DURATION) {
                const progress = clamp(game.elapsed / SCROLL_DURATION, 0, 1);
                scene.x = lerp(0, -GAME_WIDTH, progress);
            } else if (game.elapsed < MAIN_DURATION) {
                scene.x = -GAME_WIDTH;
            } else {
                scene.x = -GAME_WIDTH;
                game.state = "fadeOut";
                game.fadeAlpha = 0;
            }
        }

        function updateFadeOut(deltaTime) {
            game.fadeAlpha += deltaTime / FADE_DURATION;
            game.fadeAlpha = clamp(game.fadeAlpha, 0, 1);

            if (game.fadeAlpha >= 1) {
                scene.x = 0;
                game.elapsed = 0;
                game.state = "fadeIn";
            }
        }

        function updateFadeIn(deltaTime) {
            game.fadeAlpha -= deltaTime / FADE_DURATION;
            game.fadeAlpha = clamp(game.fadeAlpha, 0, 1);

            if (game.fadeAlpha <= 0) {
                game.fadeAlpha = 0;
                game.state = "playing";
            }
        }

        function update(deltaTime) {
            if (!game.ready) {
                return;
            }

            switch (game.state) {
                case "playing":
                    updatePlaying(deltaTime);
                    break;

                case "fadeOut":
                    updateFadeOut(deltaTime);
                    break;

                case "fadeIn":
                    updateFadeIn(deltaTime);
                    break;
            }

            updateDebug();
        }

        // ========================================================
        // Scene Drawing
        // ========================================================

        function drawMainScene() {
            gameCtx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            if (!game.ready) {
                gameCtx.fillStyle = "#000";
                gameCtx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                return;
            }

            // BG01
            gameCtx.drawImage(
                BG01,
                scene.x,
                0,
                GAME_WIDTH,
                GAME_HEIGHT
            );

            // BG02
            gameCtx.drawImage(
                BG02,
                scene.x + GAME_WIDTH,
                0,
                GAME_WIDTH,
                GAME_HEIGHT
            );

            // Fade overlay
            if (game.fadeAlpha > 0) {
                gameCtx.save();
                gameCtx.globalAlpha = game.fadeAlpha;
                gameCtx.fillStyle = "#000";
                gameCtx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                gameCtx.restore();
            }
        }

        function drawBackdropFromMainCanvas() {
            const { viewportWidth, viewportHeight } = display.layout;

            backdropCtx.clearRect(0, 0, viewportWidth, viewportHeight);

            if (!game.ready) {
                backdropCtx.fillStyle = "#000";
                backdropCtx.fillRect(0, 0, viewportWidth, viewportHeight);
                return;
            }

            const scale = Math.max(
                viewportWidth / GAME_WIDTH,
                viewportHeight / GAME_HEIGHT
            );

            const drawWidth = GAME_WIDTH * scale;
            const drawHeight = GAME_HEIGHT * scale;
            const drawX = (viewportWidth - drawWidth) * 0.5;
            const drawY = (viewportHeight - drawHeight) * 0.5;

            backdropCtx.drawImage(
                gameCanvas,
                drawX,
                drawY,
                drawWidth,
                drawHeight
            );
        }

        function render() {
            drawMainScene();
            drawBackdropFromMainCanvas();
        }

        // ========================================================
        // Debug
        // ========================================================

        function updateDebug() {
            let phase = "";

            if (game.state === "fadeOut") {
                phase = "Fade Out";
            } else if (game.state === "fadeIn") {
                phase = "Fade In";
            } else if (game.elapsed < SCROLL_DURATION) {
                phase = "BG01 Scrolling";
            } else {
                phase = "BG02 Hold";
            }

            const minutes = Math.floor(game.elapsed / 60);
            const seconds = Math.floor(game.elapsed % 60);

            debugElement.innerHTML =
                "Phase: " + phase +
                "<br>" +
                "Time: " + minutes + ":" + String(seconds).padStart(2, "0") +
                "<br>" +
                "Scene X: " + Math.round(scene.x) +
                "<br>" +
                "Fade: " + game.fadeAlpha.toFixed(2) +
                "<br>" +
                "Rotate: " + (display.rotated ? "90°" : "0°");
        }

        // ========================================================
        // Loop
        // ========================================================

        function gameLoop(timestamp) {
            if (game.lastTimestamp === 0) {
                game.lastTimestamp = timestamp;
            }

            let deltaTime = (timestamp - game.lastTimestamp) / 1000;
            game.lastTimestamp = timestamp;
            deltaTime = Math.min(deltaTime, 0.05);

            update(deltaTime);
            render();

            requestAnimationFrame(gameLoop);
        }

        // ========================================================
        // Rotate
        // ========================================================

        async function tryLandscape() {
            try {
                if (
                    !document.fullscreenElement &&
                    document.documentElement.requestFullscreen
                ) {
                    await document.documentElement.requestFullscreen();
                }

                if (
                    screen.orientation &&
                    screen.orientation.lock
                ) {
                    await screen.orientation.lock("landscape");

                    display.rotated = false;
                    setTimeout(resizeGame, 150);
                    return true;
                }
            } catch (error) {
                console.log("Native rotate unavailable.", error);
            }

            return false;
        }

        rotateButton.addEventListener("click", async () => {
            if (isMobileDevice() && window.innerHeight > window.innerWidth) {
                const success = await tryLandscape();
                if (success) {
                    return;
                }
            }

            display.rotated = !display.rotated;
            resizeGame();
        });

        // ========================================================
        // Events
        // ========================================================

        window.addEventListener("resize", resizeGame);

        window.addEventListener("orientationchange", () => {
            setTimeout(resizeGame, 150);
        });

        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", resizeGame);
        }

        // ========================================================
        // Start
        // ========================================================

        resizeGame();
        loadAssets();
        requestAnimationFrame(gameLoop);
    </script>

</body>
</html>
