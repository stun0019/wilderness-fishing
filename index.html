<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>Wilderness Fishing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
        }


        /* ========================================================
           Viewport
        ======================================================== */

        #viewport {
            position: fixed;

            left: 0;
            top: 0;

            width: 100dvw;
            height: 100dvh;

            overflow: hidden;

            background: #000;
        }


        /* ========================================================
           Game Container
        ======================================================== */

        #gameContainer {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 1280px;
            height: 720px;

            transform:
                translate(-50%, -50%);

            transform-origin:
                center center;

            overflow: hidden;

            background: #000;
        }


        /* ========================================================
           Canvas
        ======================================================== */

        #gameCanvas {
            display: block;

            width: 100%;
            height: 100%;

            background: #000;
        }


        /* ========================================================
           Loading
        ======================================================== */

        #loading {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            color: #fff;

            font-family:
                Arial,
                sans-serif;

            font-size: 18px;

            z-index: 5000;

            pointer-events: none;
        }


        /* ========================================================
           Debug
        ======================================================== */

        #debug {
            position: fixed;

            left:
                max(
                    12px,
                    env(safe-area-inset-left)
                );

            top:
                max(
                    12px,
                    env(safe-area-inset-top)
                );

            padding: 8px 12px;

            color: #fff;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

            border-radius: 5px;

            font-family: monospace;
            font-size: 14px;

            line-height: 1.5;

            pointer-events: none;

            z-index: 9999;
        }


        /* ========================================================
           Rotate Button
        ======================================================== */

        #rotateButton {
            position: fixed;

            right:
                max(
                    16px,
                    env(safe-area-inset-right)
                );

            top:
                max(
                    16px,
                    env(safe-area-inset-top)
                );

            padding: 12px 20px;

            min-width: 108px;

            border: 0;

            border-radius: 10px;

            background:
                rgba(
                    20,
                    20,
                    20,
                    0.88
                );

            color: #fff;

            font-family:
                Arial,
                sans-serif;

            font-size: 15px;
            font-weight: 700;

            letter-spacing: 1px;

            cursor: pointer;

            z-index: 10000;

            -webkit-tap-highlight-color:
                transparent;
        }

        #rotateButton:active {
            transform:
                scale(0.95);
        }

    </style>
</head>


<body>

    <div id="viewport">

        <div id="gameContainer">

            <canvas
                id="gameCanvas"
                width="1280"
                height="720"
            ></canvas>

        </div>

    </div>


    <div id="loading">
        Loading...
    </div>


    <div id="debug">
        Loading...
    </div>


    <button
        id="rotateButton"
        type="button"
    >
        ROTATE
    </button>


    <script>

        // ========================================================
        // Resolution
        // ========================================================

        const GAME_WIDTH = 1280;
        const GAME_HEIGHT = 720;

        const GAME_ASPECT =
            GAME_WIDTH /
            GAME_HEIGHT;


        // ========================================================
        // Timeline
        // ========================================================

        /*
            00:00 - 02:00
            BG01 -> BG02

            02:00 - 04:00
            BG02 固定

            04:00
            Fade Out

            全黑
            ->
            BG01
            ->
            Fade In
        */

        const SCROLL_DURATION = 120;
        const HOLD_DURATION = 120;

        const MAIN_DURATION =
            SCROLL_DURATION +
            HOLD_DURATION;

        const FADE_DURATION = 1.5;


        // ========================================================
        // DOM
        // ========================================================

        const viewport =
            document.getElementById(
                "viewport"
            );

        const gameContainer =
            document.getElementById(
                "gameContainer"
            );

        const canvas =
            document.getElementById(
                "gameCanvas"
            );

        const ctx =
            canvas.getContext(
                "2d"
            );

        const loadingElement =
            document.getElementById(
                "loading"
            );

        const debugElement =
            document.getElementById(
                "debug"
            );

        const rotateButton =
            document.getElementById(
                "rotateButton"
            );


        ctx.imageSmoothingEnabled =
            true;


        // ========================================================
        // Assets
        // ========================================================

        const BG01 = new Image();
        const BG02 = new Image();

        BG01.src =
            "./assets/BG01.png";

        BG02.src =
            "./assets/BG02.png";


        // ========================================================
        // Game State
        // ========================================================

        const game = {

            ready: false,

            lastTimestamp: 0,

            elapsed: 0,

            state:
                "playing",

            fadeAlpha: 0

        };


        // ========================================================
        // Scene
        // ========================================================

        const scene = {

            x: 0

        };


        // ========================================================
        // Display
        // ========================================================

        const display = {

            rotated: false,

            scale: 1

        };


        // ========================================================
        // Device Detection
        // ========================================================

        function isMobileDevice() {

            return (

                window.matchMedia(
                    "(pointer: coarse)"
                ).matches

                ||

                /Android|iPhone|iPad|iPod/i
                    .test(
                        navigator.userAgent
                    )

            );

        }


        // ========================================================
        // Image Loader
        // ========================================================

        function loadImage(
            image
        ) {

            return new Promise(
                (
                    resolve,
                    reject
                ) => {

                    if (
                        image.complete &&
                        image.naturalWidth > 0
                    ) {

                        resolve(image);

                        return;

                    }


                    image.onload =
                        () => resolve(
                            image
                        );


                    image.onerror =
                        () => reject(

                            new Error(

                                "Failed to load " +
                                image.src

                            )

                        );

                }
            );

        }


        async function loadAssets() {

            try {

                await Promise.all([

                    loadImage(
                        BG01
                    ),

                    loadImage(
                        BG02
                    )

                ]);


                game.ready =
                    true;


                loadingElement.style.display =
                    "none";

            }

            catch (
                error
            ) {

                console.error(
                    error
                );


                loadingElement.textContent =
                    "Failed to load assets.";

            }

        }


        // ========================================================
        // Utils
        // ========================================================

        function clamp(
            value,
            min,
            max
        ) {

            return Math.max(

                min,

                Math.min(
                    max,
                    value
                )

            );

        }


        function lerp(
            start,
            end,
            t
        ) {

            return (

                start +

                (
                    end -
                    start
                ) *

                t

            );

        }


        // ========================================================
        // Timeline Update
        // ========================================================

        function updatePlaying(
            deltaTime
        ) {

            game.elapsed +=
                deltaTime;


            // 0 - 120 sec
            if (
                game.elapsed <
                SCROLL_DURATION
            ) {

                const progress =
                    clamp(

                        game.elapsed /
                        SCROLL_DURATION,

                        0,
                        1

                    );


                scene.x =
                    lerp(

                        0,

                        -GAME_WIDTH,

                        progress

                    );

            }


            // 120 - 240 sec
            else if (
                game.elapsed <
                MAIN_DURATION
            ) {

                scene.x =
                    -GAME_WIDTH;

            }


            // 240 sec
            else {

                scene.x =
                    -GAME_WIDTH;


                game.state =
                    "fadeOut";


                game.fadeAlpha =
                    0;

            }

        }


        // ========================================================
        // Fade Out
        // ========================================================

        function updateFadeOut(
            deltaTime
        ) {

            game.fadeAlpha +=

                deltaTime /
                FADE_DURATION;


            game.fadeAlpha =
                clamp(

                    game.fadeAlpha,

                    0,
                    1

                );


            if (
                game.fadeAlpha >= 1
            ) {

                scene.x =
                    0;


                game.elapsed =
                    0;


                game.state =
                    "fadeIn";

            }

        }


        // ========================================================
        // Fade In
        // ========================================================

        function updateFadeIn(
            deltaTime
        ) {

            game.fadeAlpha -=

                deltaTime /
                FADE_DURATION;


            game.fadeAlpha =
                clamp(

                    game.fadeAlpha,

                    0,
                    1

                );


            if (
                game.fadeAlpha <= 0
            ) {

                game.fadeAlpha =
                    0;


                game.state =
                    "playing";

            }

        }


        // ========================================================
        // Update
        // ========================================================

        function update(
            deltaTime
        ) {

            if (
                !game.ready
            ) {

                return;

            }


            switch (
                game.state
            ) {

                case "playing":

                    updatePlaying(
                        deltaTime
                    );

                    break;


                case "fadeOut":

                    updateFadeOut(
                        deltaTime
                    );

                    break;


                case "fadeIn":

                    updateFadeIn(
                        deltaTime
                    );

                    break;

            }


            updateDebug();

        }


        // ========================================================
        // Draw Background
        // ========================================================

        function drawBackground() {

            ctx.drawImage(

                BG01,

                scene.x,
                0,

                GAME_WIDTH,
                GAME_HEIGHT

            );


            ctx.drawImage(

                BG02,

                scene.x +
                GAME_WIDTH,

                0,

                GAME_WIDTH,
                GAME_HEIGHT

            );

        }


        // ========================================================
        // Fade
        // ========================================================

        function drawFade() {

            if (
                game.fadeAlpha <= 0
            ) {

                return;

            }


            ctx.save();


            ctx.globalAlpha =
                game.fadeAlpha;


            ctx.fillStyle =
                "#000";


            ctx.fillRect(

                0,
                0,

                GAME_WIDTH,
                GAME_HEIGHT

            );


            ctx.restore();

        }


        // ========================================================
        // Render
        // ========================================================

        function render() {

            ctx.clearRect(

                0,
                0,

                GAME_WIDTH,
                GAME_HEIGHT

            );


            if (
                !game.ready
            ) {

                ctx.fillStyle =
                    "#000";


                ctx.fillRect(

                    0,
                    0,

                    GAME_WIDTH,
                    GAME_HEIGHT

                );


                return;

            }


            drawBackground();


            /*
                Player Layer
                之後放這裡
            */


            /*
                Game UI Layer
                之後放這裡
            */


            drawFade();

        }


        // ========================================================
        // Debug
        // ========================================================

        function updateDebug() {

            let phase;


            if (
                game.state ===
                "fadeOut"
            ) {

                phase =
                    "Fade Out";

            }

            else if (
                game.state ===
                "fadeIn"
            ) {

                phase =
                    "Fade In";

            }

            else if (
                game.elapsed <
                SCROLL_DURATION
            ) {

                phase =
                    "BG01 Scrolling";

            }

            else {

                phase =
                    "BG02 Hold";

            }


            const minutes =
                Math.floor(
                    game.elapsed / 60
                );


            const seconds =
                Math.floor(
                    game.elapsed % 60
                );


            debugElement.innerHTML =

                "Phase: " +
                phase +

                "<br>" +

                "Time: " +
                minutes +
                ":" +

                String(
                    seconds
                ).padStart(
                    2,
                    "0"
                ) +

                "<br>" +

                "Scene X: " +
                Math.round(
                    scene.x
                ) +

                "<br>" +

                "Fade: " +
                game.fadeAlpha
                    .toFixed(2) +

                "<br>" +

                "Rotate: " +
                (
                    display.rotated
                        ? "90°"
                        : "0°"
                );

        }


        // ========================================================
        // Game Loop
        // ========================================================

        function gameLoop(
            timestamp
        ) {

            if (
                game.lastTimestamp === 0
            ) {

                game.lastTimestamp =
                    timestamp;

            }


            let deltaTime =

                (
                    timestamp -
                    game.lastTimestamp
                )

                / 1000;


            game.lastTimestamp =
                timestamp;


            deltaTime =
                Math.min(
                    deltaTime,
                    0.05
                );


            update(
                deltaTime
            );


            render();


            requestAnimationFrame(
                gameLoop
            );

        }


        // ========================================================
        // Get Real Mobile Viewport
        // ========================================================

        function getViewportSize() {

            if (
                window.visualViewport
            ) {

                return {

                    width:
                        window.visualViewport.width,

                    height:
                        window.visualViewport.height

                };

            }


            return {

                width:
                    window.innerWidth,

                height:
                    window.innerHeight

            };

        }


        // ========================================================
        // Resize
        // ========================================================

        function resizeGame() {

            const size =
                getViewportSize();


            const screenWidth =
                size.width;


            const screenHeight =
                size.height;


            const mobile =
                isMobileDevice();


            let scale;


            /*
                ================================================
                MOBILE
                ================================================

                使用 COVER。

                完全填滿手機螢幕，
                不出現黑邊。

                不拉伸。

                超出的部分自然裁切。
            */

            if (
                mobile
            ) {

                if (
                    !display.rotated
                ) {

                    scale =
                        Math.max(

                            screenWidth /
                            GAME_WIDTH,

                            screenHeight /
                            GAME_HEIGHT

                        );

                }

                else {

                    scale =
                        Math.max(

                            screenWidth /
                            GAME_HEIGHT,

                            screenHeight /
                            GAME_WIDTH

                        );

                }

            }


            /*
                ================================================
                DESKTOP
                ================================================

                使用 CONTAIN。

                完整保留 16:9，
                必要時留黑邊。
            */

            else {

                if (
                    !display.rotated
                ) {

                    scale =
                        Math.min(

                            screenWidth /
                            GAME_WIDTH,

                            screenHeight /
                            GAME_HEIGHT

                        );

                }

                else {

                    scale =
                        Math.min(

                            screenWidth /
                            GAME_HEIGHT,

                            screenHeight /
                            GAME_WIDTH

                        );

                }

            }


            display.scale =
                scale;


            gameContainer.style.width =

                GAME_WIDTH *
                scale +

                "px";


            gameContainer.style.height =

                GAME_HEIGHT *
                scale +

                "px";


            if (
                display.rotated
            ) {

                gameContainer.style.transform =

                    "translate(-50%, -50%) " +

                    "rotate(90deg)";

            }

            else {

                gameContainer.style.transform =

                    "translate(-50%, -50%) " +

                    "rotate(0deg)";

            }

        }


        // ========================================================
        // Native Landscape
        // ========================================================

        async function tryLandscape() {

            try {

                /*
                    先嘗試 Fullscreen。
                */

                if (
                    !document.fullscreenElement &&
                    document.documentElement
                        .requestFullscreen
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                }


                /*
                    Android Chrome 等瀏覽器
                    可以真的鎖 Landscape。
                */

                if (
                    screen.orientation &&
                    screen.orientation.lock
                ) {

                    await screen
                        .orientation
                        .lock(
                            "landscape"
                        );


                    display.rotated =
                        false;


                    setTimeout(
                        resizeGame,
                        150
                    );


                    return true;

                }

            }

            catch (
                error
            ) {

                console.log(
                    "Native rotate unavailable.",
                    error
                );

            }


            return false;

        }


        // ========================================================
        // Rotate
        // ========================================================

        rotateButton.addEventListener(

            "click",

            async () => {

                /*
                    如果目前是直式手機，
                    先嘗試真正切成 Landscape。
                */

                if (
                    window.innerHeight >
                    window.innerWidth
                ) {

                    const success =
                        await tryLandscape();


                    if (
                        success
                    ) {

                        return;

                    }

                }


                /*
                    Safari / 不支援 Orientation Lock
                    時使用 CSS Rotate。
                */

                display.rotated =
                    !display.rotated;


                resizeGame();

            }

        );


        // ========================================================
        // Resize Events
        // ========================================================

        window.addEventListener(

            "resize",

            resizeGame

        );


        window.addEventListener(

            "orientationchange",

            () => {

                setTimeout(
                    resizeGame,
                    150
                );

            }

        );


        /*
            iPhone Safari 很重要。

            地址列 / 工具列縮放都會改變
            visualViewport。
        */

        if (
            window.visualViewport
        ) {

            window.visualViewport
                .addEventListener(

                    "resize",

                    resizeGame

                );

        }


        // ========================================================
        // Start
        // ========================================================

        resizeGame();

        loadAssets();

        requestAnimationFrame(
            gameLoop
        );

    </script>

</body>
</html>
